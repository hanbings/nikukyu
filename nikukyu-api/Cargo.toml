[package]
name = "nikukyu-api"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration", "models"]

[dependencies]
models = { path = "models" }

# The reverse proxy handles HTTP/2; Actix still depends on the affected h2 0.3.
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-cors = "0.7"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rsa = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
subtle = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

[dependencies.sea-orm]
version = "2.0.4"
features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "postgres-array",
  "with-chrono",
  "with-time",
  "with-json",
  "with-uuid",
  "macros",
]
