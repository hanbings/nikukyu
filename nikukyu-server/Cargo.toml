[package]
name = "nikukyu-server"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [ ".", "entity", "migration" ]

[dependencies]
# async
tokio = { version = "1.43.0", features = ["full"] }

# log
log = "0.4.26"
env_logger = "0.11"

# config
figment = { version = "0.10", features = ["toml", "json", "env"] }

# web
axum = "0.8.1"

# utils
anyhow = "1"
uuid = "1.15.1"
serde = "1.0.218"
serde_json = "1.0.140"
dotenv = "0.15.0"
reqwest = { version = "0.12", features = ["json"] }

# database
migration = { path = "./migration" }
rustls = "0.23.23"
sea-orm = { version = "1.1.7", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-json" ] }
