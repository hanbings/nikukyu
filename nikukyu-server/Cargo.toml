[package]
name = "nikukyu-server"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [ ".", "migration" ]

[dependencies]
# async
tokio = { version = "1.45.0", features = ["full"] }

# log
log = "0.4.27"
env_logger = "0.11.8"

# config
figment = { version = "0.10", features = ["toml", "json", "env"] }

# web
axum = "0.8.4"
tower = "0.5.2"
tower-http = { version = "0.6.4", features = ["cors"] }

# utils
anyhow = "1.0.98"
rand = "0.9.1"
serde = "1.0.218"
serde_json = "1.0.140"
dotenv = "0.15.0"
uuid = { version = "1.17.0", features = ["v4"] }
reqwest = { version = "0.12.15", features = ["json"] }

# database
migration = { path = "./migration" }
rustls = "0.23.27"
sea-orm = { version = "1.1.11", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-json" ] }
