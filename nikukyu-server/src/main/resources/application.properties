spring.application.name=nikukyu-server
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB

# postgres
spring.datasource.url=jdbc:postgresql://192.168.22.207:5432/nikukyu
spring.datasource.username=nikukyu
spring.datasource.password=0887cfe6-9692-ce22-7ce3-f8dfb05bbff1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# redis
spring.data.redis.database=0
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=password
spring.data.redis.timeout=60000
spring.data.redis.repositories.enabled=false

# mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<login user to smtp server>
spring.mail.password=<login password to smtp server>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# sa-token
sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.token-style=random-32
sa-token.timeout=2592000
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.is-log=true

# application
nikukyu.config.api=http://localhost:8080
nikukyu.config.site=http://localhost:8080
nikukyu.config.name=Nikukyu
nikukyu.config.mail=<mail sender>
nikukyu.config.privacy=https://127.0.0.1/privacy-policy
nikukyu.config.tos=https://127.0.0.1/terms-of-service